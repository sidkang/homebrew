name: Verify Sarasa SS17 SC Nerd Font

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-sarasa-ss17-sc-nerd-font.yml
      - .github/workflows/release-sarasa-ss17-sc-nerd-font.yml
      - fonts/sarasa-ss17-sc-nerd-font/**
      - fonts/iosevka-term-slab-ss17/**
  pull_request:
    paths:
      - .github/workflows/verify-sarasa-ss17-sc-nerd-font.yml
      - .github/workflows/release-sarasa-ss17-sc-nerd-font.yml
      - fonts/sarasa-ss17-sc-nerd-font/**
      - fonts/iosevka-term-slab-ss17/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-sarasa-ss17-sc-nerd-font-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      # Build the ten-face Term Slab donor locally until 34.7.0-r2 is published.
      # Pin matches verify-iosevka-term-slab-ss17.yml.
      - name: Check out pinned Iosevka source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: be5invis/Iosevka
          ref: 6828cb0bd569992bb19565a5e448540de3b50541 # v34.7.0
          path: .upstream/iosevka
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.28
          enable-cache: false
      - name: Build Iosevka Term Slab SS17 donor
        env:
          IOSEVKA_SOURCE: ${{ github.workspace }}/.upstream/iosevka
        run: |
          set -euo pipefail
          fonts/iosevka-term-slab-ss17/build.sh
          archives=(dist/releases/IosevkaTermSlabSS17-*.zip)
          test "${#archives[@]}" -eq 1
          archive=$(realpath "${archives[0]}")
          {
            echo "IOSEVKA_TERM_SLAB_URL=file://${archive}"
            echo "IOSEVKA_TERM_SLAB_SHA256=$(sha256sum "$archive" | awk '{print $1}')"
          } >> "$GITHUB_ENV"
      # Remaining sources use module defaults.
      - name: Build and verify
        run: fonts/sarasa-ss17-sc-nerd-font/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarasa-ss17-sc-nerd-font
          path: dist/releases/SarasaSS17SCNF-*.zip
          if-no-files-found: error
