name: Release Sarasa SS17 SC Nerd Font

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      revision:
        description: Rebuild revision number (positive integer) for unchanged sources
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-sarasa-ss17-sc-nerd-font
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'sidkang/homebrew'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      version: ${{ steps.detect.outputs.version }}
      build_env: ${{ steps.detect.outputs.build_env }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Minimum donor release supporting all ten faces.
          min_donor="34.7.0-r2"

          tag_of() { gh api "repos/$1/releases/latest" --jq .tag_name; }
          sha_of() { curl -fsSL --retry 3 --retry-all-errors "$1/SHA-256.txt" | awk -v name="$2" '$NF == name {print $1; exit}'; }
          cask_of() { gh api "repos/$GITHUB_REPOSITORY/contents/Casks/$1.rb?ref=master" -H "Accept: application/vnd.github.raw"; }
          field_of() { awk -F'"' -v key="$1" '$0 ~ "^  " key " " {print $2; exit}'; }
          expect() { [[ $1 =~ $2 ]] || { echo "::error::unexpected $3: '$1'"; exit 1; }; }

          # Upstream Iosevka version must match between Term Slab donor and official Mono donor.
          donor_cask=$(cask_of font-iosevka-term-slab-ss17)
          donor_version=$(field_of version <<<"$donor_cask")
          donor_sha=$(field_of sha256 <<<"$donor_cask")
          expect "$donor_version" '^[0-9]+(\.[0-9]+)*(-r[0-9]+)?$' "Iosevka Term Slab SS17 cask version"
          expect "$donor_sha" '^[0-9a-f]{64}$' "Iosevka Term Slab SS17 cask sha256"
          iosevka_version=${donor_version%%-*}

          # Skip build if donor cask has not updated to ten-face release.
          if ! printf '%s\n' "$min_donor" "$donor_version" | sort -V -C; then
            echo "::warning::Iosevka Term Slab SS17 $donor_version is older than $min_donor. Waiting for ten-face release."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sarasa_tag=$(tag_of be5invis/Sarasa-Gothic)
          nerd_tag=$(tag_of ryanoasis/nerd-fonts)
          expect "$sarasa_tag" '^v[0-9]+(\.[0-9]+)*$' "Sarasa Gothic tag"
          expect "$nerd_tag" '^v[0-9]+(\.[0-9]+)*$' "Nerd Fonts tag"
          sarasa_version=${sarasa_tag#v}
          nerd_version=${nerd_tag#v}

          sarasa_base="https://github.com/be5invis/Sarasa-Gothic/releases/download/$sarasa_tag"
          iosevka_base="https://github.com/be5invis/Iosevka/releases/download/v$iosevka_version"
          nerd_base="https://github.com/ryanoasis/nerd-fonts/releases/download/$nerd_tag"
          term_file="SarasaTermSlabSC-TTF-$sarasa_version.7z"
          mono_file="SarasaMonoSC-TTF-$sarasa_version.7z"
          iosevka_file="PkgTTC-IosevkaSS17-$iosevka_version.zip"
          term_sha=$(sha_of "$sarasa_base" "$term_file")
          mono_sha=$(sha_of "$sarasa_base" "$mono_file")
          iosevka_sha=$(sha_of "$iosevka_base" "$iosevka_file")
          nerd_sha=$(sha_of "$nerd_base" IosevkaTerm.zip)
          for digest in "$term_sha" "$mono_sha" "$iosevka_sha" "$nerd_sha"; do
            expect "$digest" '^[0-9a-f]{64}$' "upstream sha256"
          done

          version="$sarasa_version-$donor_version-$nerd_version"
          if [ -n "$REVISION" ]; then
            expect "$REVISION" '^[1-9][0-9]*$' "revision"
            version="$version-r$REVISION"
          fi

          current=""
          if cask=$(cask_of font-sarasa-ss17-sc-nerd-font 2>/tmp/cask.err); then
            current=$(field_of version <<<"$cask")
          elif ! grep -q "HTTP 404" /tmp/cask.err; then
            cat /tmp/cask.err
            exit 1
          fi

          # Skip build if source versions match published cask and no revision is specified.
          if [ -z "$REVISION" ] && [ "$(sed -E 's/-r[0-9]+$//' <<<"$current")" = "$version" ]; then
            echo "Already published $current"
            should_build=false
          else
            echo "Building $version (published: ${current:-none})"
            should_build=true
          fi

          {
            echo "should_build=$should_build"
            echo "version=$version"
            echo "build_env<<BUILD_ENV_EOF"
            echo "FONT_VERSION=$version"
            echo "SARASA_TERM_SLAB_URL=$sarasa_base/$term_file"
            echo "SARASA_TERM_SLAB_SHA256=$term_sha"
            echo "SARASA_MONO_URL=$sarasa_base/$mono_file"
            echo "SARASA_MONO_SHA256=$mono_sha"
            echo "IOSEVKA_TERM_SLAB_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/iosevka-term-slab-ss17-v$donor_version/IosevkaTermSlabSS17-$donor_version.zip"
            echo "IOSEVKA_TERM_SLAB_SHA256=$donor_sha"
            echo "IOSEVKA_MONO_URL=$iosevka_base/$iosevka_file"
            echo "IOSEVKA_MONO_SHA256=$iosevka_sha"
            echo "NERD_URL=$nerd_base/IosevkaTerm.zip"
            echo "NERD_SHA256=$nerd_sha"
            echo "BUILD_ENV_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: github.repository == 'sidkang/homebrew' && needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.28
          enable-cache: false
      - name: Build and verify
        env:
          BUILD_ENV: ${{ needs.detect.outputs.build_env }}
        run: |
          set -euo pipefail
          # Validate build environment variables.
          if grep -Ev '^[A-Z0-9_]+=[A-Za-z0-9._:/+-]+$' <<<"$BUILD_ENV"; then
            echo "::error::unexpected build_env line"
            exit 1
          fi
          set -a
          source /dev/stdin <<<"$BUILD_ENV"
          set +a
          fonts/sarasa-ss17-sc-nerd-font/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarasa-ss17-sc-nerd-font-release
          path: dist/releases/SarasaSS17SCNF-${{ needs.detect.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: [detect, build]
    if: github.repository == 'sidkang/homebrew' && needs.detect.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Clean checkout for cask commit. No repository code runs in the publish job.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sarasa-ss17-sc-nerd-font-release
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="sarasa-ss17-sc-nerd-font-v${VERSION}"
          asset="SarasaSS17SCNF-${VERSION}.zip"
          built="release/${asset}"
          test -f "$built"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$built" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Sarasa SS17 SC Nerd Font ${VERSION}" \
              --notes "Sarasa Term Slab SC and Sarasa Mono SC with SS17 Latin and Nerd Font icons. Ten faces per family. Spinner range U+F800–U+F83F is omitted." \
              --latest=false
          fi
          # Releases are immutable. If the tag exists, reuse the published asset.
          mkdir -p published
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir published
          unzip -Z1 "published/${asset}" > published/files.txt
          for font in SarasaTermSlabSS17SCNF.ttc SarasaMonoSS17SCNF.ttc; do
            grep -qxF "$font" published/files.txt
          done
          published_sha=$(shasum -a 256 "published/${asset}" | awk '{print $1}')
          if [ "$published_sha" != "$(shasum -a 256 "$built" | awk '{print $1}')" ]; then
            echo "::warning::$tag already exists. Using published asset for cask update."
          fi
          echo "sha256=${published_sha}" >> "$GITHUB_ENV"
      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old=font-sarasa-term-slab-ss17-sc-nerd-font
          new=font-sarasa-ss17-sc-nerd-font
          mkdir -p Casks
          cat > "Casks/${new}.rb" <<EOF
          cask "${new}" do
            version "${VERSION}"
            sha256 "${sha256}"

            url "https://github.com/sidkang/homebrew/releases/download/sarasa-ss17-sc-nerd-font-v#{version}/SarasaSS17SCNF-#{version}.zip"
            name "Sarasa SS17 SC Nerd Font"
            desc "Sarasa Term Slab and Mono SC with SS17 Latin and Nerd Font icons"
            homepage "https://github.com/sidkang/homebrew/tree/master/fonts/sarasa-ss17-sc-nerd-font"

            livecheck do
              skip "Rebuilt weekly from Sarasa, Iosevka Term Slab SS17, Iosevka, and Nerd Fonts"
            end

            font "SarasaTermSlabSS17SCNF.ttc"
            font "SarasaMonoSS17SCNF.ttc"
          end
          EOF
          # Register rename from deprecated single-family cask to new bundle cask.
          python3 - "$old" "$new" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("cask_renames.json")
          renames = json.loads(path.read_text()) if path.exists() else {}
          renames[sys.argv[1]] = sys.argv[2]
          path.write_text(json.dumps(renames, indent=2, sort_keys=True) + "\n")
          PY
          git rm -f --ignore-unmatch "Casks/${old}.rb"
          brew tap sidkang/homebrew "https://github.com/${GITHUB_REPOSITORY}"
          tap_dir="$(brew --repo sidkang/homebrew)"
          rm -f "${tap_dir}/Casks/${old}.rb"
          cp "Casks/${new}.rb" "${tap_dir}/Casks/"
          cp cask_renames.json "${tap_dir}/"
          brew style --cask "sidkang/homebrew/${new}"
          brew audit --cask --online "sidkang/homebrew/${new}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${new}.rb" cask_renames.json
          git diff --cached --quiet || git commit -m "chore(cask): release Sarasa SS17 SC Nerd Font ${VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1
