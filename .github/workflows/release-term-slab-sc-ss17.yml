name: Release Term Slab SC SS17

on:
  push:
    tags:
      - term-slab-sc-ss17-v*

permissions:
  contents: read

concurrency:
  group: release-term-slab-sc-ss17
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'sidkang/homebrew'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.28
          enable-cache: false
      - name: Build and verify
        run: fonts/term-slab-sc-ss17/build.sh
      - id: version
        name: Validate version tag
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("dist/term-slab-sc-ss17/BUILD-INFO.json"))["version"])')
          test "$GITHUB_REF_NAME" = "term-slab-sc-ss17-v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: term-slab-sc-ss17-release
          path: dist/releases/TermSlabSCSS17-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: term-slab-sc-ss17-release
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="term-slab-sc-ss17-v${RELEASE_VERSION}"
          built="release/TermSlabSCSS17-${RELEASE_VERSION}.zip"
          test -f "$built"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$built" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Term Slab SC SS17 ${RELEASE_VERSION}" \
              --notes "Sarasa Term Slab SC with Iosevka Term Slab SS17 Latin and symbols, plus IosevkaTerm Nerd Font Mono icons. The spinner range U+F800-U+F83F is omitted."
          fi
          mkdir -p published
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "TermSlabSCSS17-${RELEASE_VERSION}.zip" --dir published
          published_zip="published/TermSlabSCSS17-${RELEASE_VERSION}.zip"
          test -f "$published_zip"
          built_sha=$(shasum -a 256 "$built" | awk '{print $1}')
          published_sha=$(shasum -a 256 "$published_zip" | awk '{print $1}')
          test "$built_sha" = "$published_sha"
          echo "sha256=$published_sha" >> "$GITHUB_ENV"
      - name: Update Homebrew cask
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > Casks/font-term-slab-sc-ss17.rb <<EOF
          cask "font-term-slab-sc-ss17" do
            version "${RELEASE_VERSION}"
            sha256 "${sha256}"

            url "https://github.com/sidkang/homebrew/releases/download/term-slab-sc-ss17-v${RELEASE_VERSION}/TermSlabSCSS17-${RELEASE_VERSION}.zip"
            name "Term Slab SC SS17"
            desc "Sarasa Term Slab SC with Iosevka SS17 Latin and Nerd Font icons"
            homepage "https://github.com/sidkang/homebrew/tree/master/fonts/term-slab-sc-ss17"

            font "TermSlabSCSS17.ttc"
          end
          EOF
          tap="$(brew --repository)/Library/Taps/sidkang/homebrew-stylecheck"
          mkdir -p "$tap/Casks"
          cp Casks/font-term-slab-sc-ss17.rb "$tap/Casks/"
          brew style --cask "$tap/Casks/font-term-slab-sc-ss17.rb"
          brew audit --cask --online "$tap/Casks/font-term-slab-sc-ss17.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/font-term-slab-sc-ss17.rb
          git diff --cached --quiet || git commit -m "chore(cask): release Term Slab SC SS17 ${RELEASE_VERSION}"
          git push origin HEAD:master
